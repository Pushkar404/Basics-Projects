<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Weather API</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="img/Clouds.svg" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">🌤️ Weather App</div>

      <div>
        <span>My Weather Forecast</span>
      </div>
    </nav>
    <main>
      <h1><img src="img/Clouds.svg" /> My Weather Forecast</h1>
      <div class="input-box">
        <input
          type="text"
          placeholder="Enter your City"
          id="input-text"
          autofocus
        />
        <button id="input-btn">🔍</button>
      </div>
    </main>
    <div>
      <div id="weather-result" class="card"></div>
    </div>

    <footer>
      <p>
        © 2026 My Weather Forecast | Made by
        <a href="https://github.com/Pushkar404/" target="_blank">
          <i class="fa-brands fa-github"></i>
          Pushkar404
        </a>
      </p>
    </footer>
    <script type="module" src="script.js"></script>
  </body>
</html>
